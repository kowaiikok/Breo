<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breo Track Order</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #17201d;
        --muted: #61706b;
        --paper: #f5faf6;
        --panel: #ffffff;
        --line: #dce4df;
        --green: #1f7a4d;
        --mint: #e6f5eb;
        --coral: #e9654f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Manrope", system-ui, sans-serif;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px clamp(18px, 4vw, 56px);
        background: rgba(255, 255, 255, 0.92);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(16px);
      }

      a {
        color: inherit;
        font-weight: 800;
      }

      select {
        font: inherit;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.35rem;
        font-weight: 800;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--ink);
        color: white;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .language-select {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 12px;
        background: white;
        color: var(--muted);
        font-size: 0.85rem;
        font-weight: 800;
      }

      main {
        display: grid;
        gap: 18px;
        padding: clamp(28px, 5vw, 56px);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2.2rem, 6vw, 5rem);
        line-height: 1;
      }

      p {
        color: var(--muted);
        line-height: 1.55;
      }

      .tracker-card {
        display: grid;
        gap: 18px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: clamp(18px, 4vw, 28px);
        background: var(--panel);
        box-shadow: 0 14px 42px rgba(21, 35, 30, 0.08);
      }

      .status-pill {
        width: fit-content;
        border-radius: 999px;
        padding: 8px 12px;
        background: var(--mint);
        color: var(--green);
        font-weight: 800;
      }

      .status-pill.declined {
        background: #fff1ea;
        color: var(--coral);
      }

      .order-timeline {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 0;
        margin: 8px 0 4px;
      }

      .timeline-step {
        position: relative;
        display: grid;
        gap: 8px;
        justify-items: center;
        min-width: 0;
        text-align: center;
      }

      .timeline-step::before {
        content: "";
        position: absolute;
        top: 17px;
        left: -50%;
        width: 100%;
        height: 3px;
        background: var(--line);
      }

      .timeline-step:first-child::before {
        display: none;
      }

      .timeline-step.done::before {
        background: var(--green);
      }

      .timeline-dot {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border: 2px solid var(--line);
        border-radius: 50%;
        background: white;
        color: var(--muted);
        font-weight: 800;
      }

      .timeline-step.done .timeline-dot,
      .timeline-step.current .timeline-dot {
        border-color: var(--green);
        background: var(--green);
        color: white;
      }

      .timeline-step.current .timeline-dot {
        box-shadow: 0 0 0 6px rgba(31, 122, 77, 0.12);
      }

      .timeline-step.declined .timeline-dot {
        border-color: var(--coral);
        background: var(--coral);
        color: white;
      }

      .timeline-label {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 800;
        line-height: 1.25;
      }

      .timeline-step.done .timeline-label,
      .timeline-step.current .timeline-label {
        color: var(--ink);
      }

      .timeline-note {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .meta {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .meta div,
      .products,
      .route-map,
      .associate-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: #fbfcfa;
      }

      .meta strong,
      .products strong {
        display: block;
        margin-bottom: 4px;
      }

      .product-row {
        display: grid;
        grid-template-columns: 140px minmax(0, 1fr) 70px;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }

      .product-row:first-of-type {
        border-top: 0;
      }

      .route-map {
        display: grid;
        gap: 12px;
        background: #f4faf7;
      }

      .associate-card {
        display: grid;
        gap: 8px;
        border-color: rgba(31, 122, 77, 0.24);
        background: #f2fbf5;
      }

      .associate-card span {
        color: var(--muted);
        line-height: 1.5;
      }

      .route-visual {
        position: relative;
        min-height: 220px;
        overflow: hidden;
        border-radius: 8px;
        border: 1px solid var(--line);
        background:
          linear-gradient(135deg, rgba(230, 245, 235, 0.95), rgba(255, 255, 255, 0.8)),
          repeating-linear-gradient(45deg, transparent 0 18px, rgba(31, 122, 77, 0.08) 18px 20px);
      }

      .route-visual::before {
        content: "";
        position: absolute;
        left: 22%;
        right: 22%;
        top: 52%;
        border-top: 3px dashed rgba(31, 122, 77, 0.58);
        transform: rotate(-8deg);
      }

      .map-pin {
        position: absolute;
        display: grid;
        gap: 5px;
        width: min(230px, 42%);
      }

      .map-pin::before {
        content: "";
        width: 18px;
        height: 18px;
        border: 4px solid white;
        border-radius: 50% 50% 50% 0;
        background: var(--green);
        box-shadow: 0 8px 18px rgba(23, 32, 29, 0.18);
        transform: rotate(-45deg);
      }

      .map-pin strong,
      .map-pin span {
        display: block;
        padding: 6px 8px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.9);
      }

      .map-pin span {
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.35;
      }

      .map-pin.branch {
        left: 8%;
        top: 22%;
      }

      .map-pin.customer {
        right: 8%;
        bottom: 16%;
      }

      .empty {
        border: 1px dashed var(--line);
        border-radius: 10px;
        padding: 28px;
        background: white;
      }

      @media (max-width: 860px) {
        .meta,
        .product-row {
          grid-template-columns: 1fr;
        }

        .order-timeline {
          grid-template-columns: 1fr;
          gap: 14px;
        }

        .timeline-step {
          grid-template-columns: 36px minmax(0, 1fr);
          justify-items: start;
          text-align: left;
        }

        .timeline-step::before {
          top: -14px;
          left: 17px;
          width: 3px;
          height: 14px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="main.html">
        <span class="brand-mark">b</span>
        <span>Breo</span>
      </a>
      <div class="header-actions">
        <select class="language-select" id="languageSelect" aria-label="Language">
          <option value="en">English</option>
          <option value="zh">中文</option>
        </select>
        <a href="main.html" id="backLink">Back to customer dashboard</a>
      </div>
    </header>

    <main>
      <section>
        <h1 id="pageTitle">Track Order</h1>
        <p id="pageIntro">See the latest admin decision, delivery ETA, branch route, and fulfilment status for your Breo order.</p>
      </section>
      <section id="tracker"></section>
    </main>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
      import { collection, getFirestore, onSnapshot, orderBy, query } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCjybi81PE45GUROrLoJ_1jiw9AGAh1NO0",
        authDomain: "breo-5e8f7.firebaseapp.com",
        projectId: "breo-5e8f7",
        storageBucket: "breo-5e8f7.firebasestorage.app",
        messagingSenderId: "875116064178",
        appId: "1:875116064178:web:5bafddb2b4fe4f3e2f08ab",
        measurementId: "G-DRL2NMCLKV",
      };

      const branchLocations = {
        "Bukit Jalil": "Pavilion Bukit Jalil, Persiaran Jalil 8, Bukit Jalil, 57000 Kuala Lumpur",
        "1 Utama": "1 Utama Shopping Centre, Bandar Utama, 47800 Petaling Jaya, Selangor",
      };

      const tracker = document.querySelector("#tracker");
      const languageSelect = document.querySelector("#languageSelect");
      let language = localStorage.getItem("breoLanguage") || "en";
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      let latestTrackedOrder = null;

      const zhTranslations = {
        "Back to customer dashboard": "返回顾客主页",
        "Track Order": "追踪订单",
        "See the latest admin decision, delivery ETA, branch route, and fulfilment status for your Breo order.": "查看您的 Breo 订单最新管理员决定、预计送达、分店路线和履行状态。",
        "No tracked order found yet. Place an order from the customer dashboard first.": "暂时找不到可追踪订单。请先从顾客主页下单。",
        "Paid": "已付款",
        "Admin accepted": "管理员已接受",
        "Packing": "正在包装",
        "Shipped": "已发货",
        "Delivered": "已送达",
        "Waiting for payment/admin review": "等待付款 / 管理员审核",
        "The order stopped after admin review. Check the admin note for the reason.": "订单已在管理员审核后停止。请查看管理员备注了解原因。",
        "Current step": "当前步骤",
        "This order was declined by admin.": "此订单已被管理员拒绝。",
        "Your Breo order has been delivered.": "您的 Breo 订单已送达。",
        "Your Breo order has been delivered. Thank you for shopping with Breo.": "您的 Breo 订单已送达。感谢您在 Breo 购物。",
        "Your order has been accepted.": "您的订单已被接受。",
        "Expected delivery arrival": "预计送达日期",
        "Your order was sent to": "您的订单已发送到",
        "Your order is pending admin review.": "您的订单正在等待管理员审核。",
        "Customer": "顾客",
        "Branch": "分店",
        "Payment": "付款",
        "Delivery": "配送",
        "Products": "产品",
        "No note": "无备注",
        "Waiting for admin": "等待管理员",
        "Pending Admin Review": "等待管理员审核",
        "Accepted": "已接受",
        "Declined": "已拒绝",
        "Sent to Branch": "已发送到分店",
        "New Order": "新订单",
        "Ready for Courier": "等待快递取件",
        "Completed": "已完成",
        "Sales associate assigned": "已分配销售员",
        "Assigned sales associate": "已分配销售员",
        "Associate code": "销售员代码",
        "is assigned to": "已分配给",
        "Your product order and sales support are arranged under this associate.": "您的产品订单和销售支持会安排在这位销售员名下。",
        "Your address": "您的地址",
        "Selected branch": "已选择分店",
        "Open route in Google Maps": "在 Google Maps 打开路线",
        "Qty": "数量",
      };

      function t(text) {
        return language === "zh" ? zhTranslations[text] || text : text;
      }

      function localizedStatus(status) {
        return t(status || "Pending Admin Review");
      }

      function localizeMessage(message) {
        if (!message || language !== "zh") return message || "";
        const branchStatusMatch = message.match(/^Branch status updated: (.+)\.$/);
        if (branchStatusMatch) return `分店状态已更新：${localizedStatus(branchStatusMatch[1])}。`;
        if (zhTranslations[message]) return zhTranslations[message];
        return message
          .replace("Your order has been accepted.", "您的订单已被接受。")
          .replace("Expected delivery arrival:", "预计送达日期：")
          .replace("Your order was sent to", "您的订单已发送到");
      }

      function applyLanguageShell() {
        document.documentElement.lang = language === "zh" ? "zh-Hans" : "en";
        document.title = language === "zh" ? "Breo 订单追踪" : "Breo Track Order";
        languageSelect.value = language;
        document.querySelector("#backLink").textContent = t("Back to customer dashboard");
        document.querySelector("#pageTitle").textContent = t("Track Order");
        document.querySelector("#pageIntro").textContent = t("See the latest admin decision, delivery ETA, branch route, and fulfilment status for your Breo order.");
      }

      function localOrders() {
        return JSON.parse(localStorage.getItem("breoLocalOrders") || "[]");
      }

      function normalizeEmail(email) {
        return (email || "").trim().toLowerCase();
      }

      function trackedOrder(candidates) {
        const member = JSON.parse(localStorage.getItem("breoMember") || "null");
        const lastOrderId = localStorage.getItem("breoLastOrderId");
        const memberEmail = normalizeEmail(member?.email);
        return candidates.find((order) => order.orderId === lastOrderId) || candidates.find((order) => normalizeEmail(order.customerEmail) === memberEmail);
      }

      function mergeOrders(cloudOrders, browserOrders) {
        const merged = new Map();
        cloudOrders.forEach((order) => merged.set(order.orderId || order.id, order));
        browserOrders.forEach((localOrder) => {
          const key = localOrder.orderId || localOrder.id;
          const cloudOrder = merged.get(key);
          if (!cloudOrder) {
            merged.set(key, localOrder);
            return;
          }
          const localHasBranchProgress = localOrder.branchStatus && localOrder.branchStatus !== "Waiting for admin";
          const localReviewed = localOrder.status === "Accepted" || localOrder.status === "Declined" || localOrder.status === "Sent to Branch" || localHasBranchProgress;
          const cloudPending = !cloudOrder.status || cloudOrder.status === "Pending Admin Review" || cloudOrder.adminDecision === "Pending";
          merged.set(key, (localReviewed && cloudPending) || localHasBranchProgress ? { ...cloudOrder, ...localOrder } : { ...localOrder, ...cloudOrder });
        });
        return [...merged.values()];
      }

      function money(value) {
        return new Intl.NumberFormat("en-MY", { style: "currency", currency: "MYR", maximumFractionDigits: 0 }).format(value || 0);
      }

      function eta(order) {
        if (order.estimatedDeliveryDate) return order.estimatedDeliveryDate;
        const date = new Date(order.reviewedAtLocal || order.createdAtLocal || new Date().toISOString());
        date.setDate(date.getDate() + 5);
        return date.toLocaleDateString(language === "zh" ? "zh-CN" : "en-MY", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
      }

      function statusText(order) {
        if (order.status === "Declined") return localizeMessage(order.adminNote || order.customerMessage || "This order was declined by admin.");
        if (order.branchStatus === "Completed") return localizeMessage(order.customerMessage || "Your Breo order has been delivered.");
        if (order.status === "Accepted") return localizeMessage(order.customerMessage || (language === "zh" ? `您的订单已被接受。预计送达日期：${eta(order)}。` : `Your order has been accepted. Expected delivery arrival: ${eta(order)}.`));
        if (order.status === "Sent to Branch") return localizeMessage(order.customerMessage || (language === "zh" ? `您的订单已发送到 ${order.branch}。` : `Your order was sent to ${order.branch}.`));
        return t("Your order is pending admin review.");
      }

      function timelineIndex(order) {
        if (order.status === "Declined") return -1;
        const branchStatus = `${order.branchStatus || ""}`.toLowerCase();
        const status = `${order.status || ""}`.toLowerCase();
        const payment = `${order.paymentStatus || ""} ${order.paymentMethod || ""}`.toLowerCase();
        if (branchStatus.includes("delivered") || branchStatus.includes("completed") || status.includes("delivered") || status.includes("completed")) return 4;
        if (branchStatus.includes("shipped") || status.includes("shipped")) return 3;
        if (branchStatus.includes("packing") || status.includes("sent to branch")) return 2;
        if (branchStatus.includes("new order")) return 1;
        if (status.includes("accepted")) return 1;
        if (payment.includes("paid") || payment.includes("completed") || payment.includes("cash on delivery") || payment.includes("collect on delivery")) return 0;
        return -1;
      }

      function timelineHtml(order) {
        const steps = ["Paid", "Admin accepted", "Packing", "Shipped", "Delivered"];
        const activeIndex = timelineIndex(order);
        if (order.status === "Declined") {
          return `
            <div class="order-timeline" aria-label="Order tracking timeline">
              ${steps.map((step, index) => `
                <div class="timeline-step ${index === 0 ? "done" : index === 1 ? "declined current" : ""}">
                  <span class="timeline-dot">${index === 1 ? "!" : index + 1}</span>
                  <span class="timeline-label">${t(step)}</span>
                </div>
              `).join("")}
            </div>
            <p class="timeline-note">${t("The order stopped after admin review. Check the admin note for the reason.")}</p>
          `;
        }

        return `
          <div class="order-timeline" aria-label="Order tracking timeline">
            ${steps.map((step, index) => {
              const state = index < activeIndex ? "done" : index === activeIndex ? "current" : "";
              return `
                <div class="timeline-step ${state}">
                  <span class="timeline-dot">${index < activeIndex ? "✓" : index + 1}</span>
                  <span class="timeline-label">${t(step)}</span>
                </div>
              `;
            }).join("")}
          </div>
          <p class="timeline-note">${t("Current step")}: ${activeIndex >= 0 ? t(steps[activeIndex]) : t("Waiting for payment/admin review")}.</p>
        `;
      }

      function mapsUrl(order) {
        const params = new URLSearchParams({
          api: "1",
          origin: branchLocations[order.branch] || order.branch || "",
          destination: order.deliveryAddress || "",
          travelmode: "driving",
        });
        return `https://www.google.com/maps/dir/?${params.toString()}`;
      }

      function routeHtml(order) {
        if (order.status !== "Accepted" && order.status !== "Sent to Branch" && order.branchStatus !== "Shipped") return "";
        const branchAddress = branchLocations[order.branch] || order.branch || t("Selected branch");
        return `
          <div class="route-map">
            <div class="route-visual">
              <div class="map-pin branch"><strong>${order.branch}</strong><span>${branchAddress}</span></div>
              <div class="map-pin customer"><strong>${t("Your address")}</strong><span>${order.deliveryAddress}</span></div>
            </div>
            <strong>${t("Expected delivery arrival")}: ${eta(order)}</strong>
            <a href="${mapsUrl(order)}" target="_blank" rel="noopener">${t("Open route in Google Maps")}</a>
          </div>
        `;
      }

      function associateHtml(order) {
        if (!order.salesAssociateCode) return "";
        const member = order.assignedSalesMemberDisplay || order.assignedFulfilmentMember || order.assignedSalesMember || t("Assigned sales associate");
        return `
          <div class="associate-card">
            <strong>${t("Sales associate assigned")}</strong>
            <span>${t("Associate code")} <strong>${order.salesAssociateCode}</strong> ${t("is assigned to")} <strong>${member}</strong>. ${t("Your product order and sales support are arranged under this associate.")}</span>
          </div>
        `;
      }

      function render(order) {
        if (!order) {
          tracker.innerHTML = `<div class="empty">${t("No tracked order found yet. Place an order from the customer dashboard first.")}</div>`;
          return;
        }

        const products = (order.products || [])
          .map((product) => `<div class="product-row"><strong>${product.productCode}</strong><span>${product.name}</span><span>${t("Qty")} ${product.quantity}</span></div>`)
          .join("");

        tracker.innerHTML = `
          <article class="tracker-card">
            <span class="status-pill ${order.status === "Declined" ? "declined" : ""}">${localizedStatus(order.status || "Pending Admin Review")}</span>
            <h2>${order.orderId || order.id}</h2>
            <p>${statusText(order)}</p>
            ${timelineHtml(order)}
            <div class="meta">
              <div><strong>${t("Customer")}</strong>${order.customerName}<br />${order.customerEmail}<br />${order.customerPhone || ""}</div>
              <div><strong>${t("Branch")}</strong>${order.branch}<br />${localizedStatus(order.branchStatus || "Waiting for admin")}</div>
              <div><strong>${t("Payment")}</strong>${order.paymentMethod}<br />${order.paymentReference || ""}<br />${money(order.total)}</div>
              <div><strong>${t("Delivery")}</strong>${order.deliveryAddress}<br />${order.deliveryNote || t("No note")}</div>
            </div>
            ${associateHtml(order)}
            <div class="products"><strong>${t("Products")}</strong>${products}</div>
            ${routeHtml(order)}
          </article>
        `;
      }

      function rerender() {
        applyLanguageShell();
        render(latestTrackedOrder || trackedOrder(localOrders()));
      }

      languageSelect.addEventListener("change", () => {
        language = languageSelect.value;
        localStorage.setItem("breoLanguage", language);
        rerender();
      });

      applyLanguageShell();
      latestTrackedOrder = trackedOrder(localOrders());
      render(latestTrackedOrder);

      onSnapshot(
        query(collection(db, "orders"), orderBy("createdAt", "desc")),
        (snapshot) => {
          latestTrackedOrder = trackedOrder(mergeOrders(snapshot.docs.map((docSnap) => ({ id: docSnap.id, ...docSnap.data() })), localOrders()));
          render(latestTrackedOrder);
        },
        () => {
          latestTrackedOrder = trackedOrder(localOrders());
          render(latestTrackedOrder);
        }
      );
    </script>
  </body>
</html>
